name: iOS Build

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to run'
        type: environment
        required: true
      buildType:
        description: 'Build type'
        type: choice
        default: release
        options: [debug, release]
      ipaName:
        description: 'IPA file name'
        default: Sun Shine
        required: true
      message:
        description: 'Release note'
        required: true

jobs:
  build:
    runs-on: macos-15
    environment: ${{ inputs.environment }}
    env:
      BUILD_CERTIFICATE_BASE64: ${{ secrets.APPSTORE_CERT_BASE64 }}
      P12_PASSWORD: ${{ secrets.APPSTORE_CERT_PASSWORD }}
      BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.MOBILEPROVISION_BASE64 }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      EXPORT_OPTIONS_PLIST: ${{ secrets.EXPORT_OPTIONS_PLIST }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.7'

      # The runner has no keychain of its own: import the .p12 into a temporary
      # one and drop the profile where Xcode looks for it.
      - name: Install certificate and provisioning profile
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64"       | base64 --decode --output $CERTIFICATE_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode --output $PP_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles

      - name: Build IPA
        run: |
          echo -n "$EXPORT_OPTIONS_PLIST" | base64 --decode -o $RUNNER_TEMP/ExportOptions.plist
          flutter pub get
          flutter build ipa --${{ inputs.buildType }} \
            --dart-define-from-file=_env/${{ inputs.environment }}.env \
            --export-options-plist=$RUNNER_TEMP/ExportOptions.plist

      - uses: actions/upload-artifact@v4
        with:
          name: release-ipa
          path: build/ios/ipa/*.ipa

      - name: Clean up keychain
        if: ${{ always() }}
        run: security delete-keychain $RUNNER_TEMP/app-signing.keychain-db

  release:
    needs: [build]
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-ipa

      # The IPA is named after CFBundleDisplayName, which carries the [dev] prefix.
      - name: Resolve ipa file name
        run: |
          if [ "${{ inputs.environment }}" = "prod" ]; then
            echo "APP_FILE_PATH=${{ inputs.ipaName }}.ipa" >> $GITHUB_ENV
          else
            echo "APP_FILE_PATH=[${{ inputs.environment }}]${{ inputs.ipaName }}.ipa" >> $GITHUB_ENV
          fi

      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: '${{ secrets.FIREBASE_APP_ID_IOS }}'
          serviceCredentialsFileContent: '${{ secrets.FIREBASE_APP_CREDENTIALS }}'
          groups: Devs
          file: '${{ env.APP_FILE_PATH }}'
          releaseNotes: '${{ inputs.message }}'
